<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ícono UMBRA</title>
  <desc id="desc">Símbolo de eclipse UMBRA color hueso sobre fondo negro</desc>
  <defs>
    <radialGradient id="surface" cx="34%" cy="24%" r="88%">
      <stop offset="0" stop-color="#1b1b18"/>
      <stop offset="1" stop-color="#0b0b0a"/>
    </radialGradient>
    <mask id="disc-cut">
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="150" fill="white"/>
      <rect x="243" y="36" width="26" height="440" rx="1" fill="black" transform="rotate(38 256 256)"/>
      <rect x="374" y="120" width="92" height="142" fill="black"/>
    </mask>
    <mask id="outside-disc">
      <rect width="512" height="512" fill="white"/>
      <circle cx="256" cy="256" r="150" fill="black"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#surface)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#b9643c" stroke-width="3" opacity=".28"/>
  <rect x="247" y="26" width="18" height="460" rx="1" fill="#e9e0d2" transform="rotate(38 256 256)" mask="url(#outside-disc)"/>
  <rect width="512" height="512" fill="#e9e0d2" mask="url(#disc-cut)"/>
</svg>
