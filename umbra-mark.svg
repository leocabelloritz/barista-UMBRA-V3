<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">UMBRA</title>
  <desc id="desc">Anillo irregular inspirado en la huella de una taza de café y un eclipse.</desc>
  <defs>
    <linearGradient id="coffee" x1="38" y1="38" x2="216" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ead9be"/>
      <stop offset=".42" stop-color="#c79a68"/>
      <stop offset=".72" stop-color="#8b5e3c"/>
      <stop offset="1" stop-color="#e7d6bb"/>
    </linearGradient>
    <filter id="rough" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.08" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" filter="url(#rough)">
