    <path d="M217 172 C227 150 230 126 226 105" stroke="#b98a5d" stroke-width="5" opacity=".72"/>
  </g>
  <g fill="#b98558" opacity=".78">
    <circle cx="226" cy="113" r="3.3"/><circle cx="229" cy="121" r="2.1"/><circle cx="228" cy="129" r="1.6"/><circle cx="225" cy="137" r="1.25"/><circle cx="222" cy="145" r=".95"/>
  </g>
  <g fill="#ead9be" opacity=".46">
    <circle cx="48" cy="91" r="1.4"/><circle cx="44" cy="101" r=".9"/><circle cx="62" cy="210" r="1.15"/>
  </g>
</svg>