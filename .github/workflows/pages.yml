name: Deploy UMBRA Pages

on:
  push:
    branches:
      - main
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout v4
        uses: actions/checkout@v4
        with:
          ref: v4
          path: v4

      - name: Build Pages artifact
        run: |
          mkdir -p site/v4
          rsync -a --exclude '.git' --exclude '.github' main/ site/
          rsync -a --exclude '.git' --exclude '.github' v4/ site/v4/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
